name: Build Android APK

on:
  push:
    branches:
      - main
      - 'fix/*'
      - 'feat/*'
      - 'refactor/*'
      - 'ci/*'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Custom Version Name (e.g. 0.9.1 or 1.0.0)'
        required: false
        default: ''
      version_code:
        description: 'Custom Version Code (numeric integer, optional)'
        required: false
        default: ''

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Version
        id: versioning
        run: |
          # Determine Version Name
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW_TAG="${GITHUB_REF#refs/tags/v}"
            VER_NAME="${RAW_TAG}"
            IS_RELEASE=true
          elif [[ -n "${{ inputs.version_name }}" ]]; then
            VER_NAME="${{ inputs.version_name }}"
            IS_RELEASE=false
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            VER_NAME="0.9.0-beta+${{ github.run_number }}.${SHORT_SHA}"
            IS_RELEASE=false
          fi

          # Determine Version Code
          if [[ -n "${{ inputs.version_code }}" ]]; then
            VER_CODE="${{ inputs.version_code }}"
          else
            COMMIT_COUNT=$(git rev-list --count HEAD)
            VER_CODE=$((COMMIT_COUNT + 100))
          fi

          echo "version_name=${VER_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${VER_CODE}" >> $GITHUB_OUTPUT
          echo "is_release=${IS_RELEASE}" >> $GITHUB_OUTPUT
          echo "Resolved version: ${VER_NAME} (code: ${VER_CODE})"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon \
            -PversionName="${{ steps.versioning.outputs.version_name }}" \
            -PversionCode="${{ steps.versioning.outputs.version_code }}"

      - name: Rename APK Artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/BuddyDash-${{ steps.versioning.outputs.version_name }}.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuddyDash-${{ steps.versioning.outputs.version_name }}
          path: app/build/outputs/apk/debug/BuddyDash-${{ steps.versioning.outputs.version_name }}.apk
          retention-days: 30

      - name: Publish GitHub Release (on version tag)
        if: steps.versioning.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: "BuddyDash v${{ steps.versioning.outputs.version_name }}"
          files: app/build/outputs/apk/debug/BuddyDash-${{ steps.versioning.outputs.version_name }}.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
